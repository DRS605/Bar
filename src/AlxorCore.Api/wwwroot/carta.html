<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta</title>
<style>
  /* ---- Temas de la carta (el bar elige el suyo) ---- */
  :root, [data-tema="verde"]{
    --ink:#17251e; --muted:#5f7168; --line:#e6ede9; --bg:#f4f6f4; --surface:#ffffff;
    --accent:#1f7a5a; --accent2:#14563e; --chip:#2f8a66;
    --hero:linear-gradient(135deg,#24946c,#12563d); --hero-ink:#ffffff;
    --display:"Georgia","Times New Roman",serif; --radius:18px;
  }
  [data-tema="noche"]{
    --ink:#f1ece2; --muted:#a79c88; --line:#322d24; --bg:#14120e; --surface:#1f1c16;
    --accent:#d7a94a; --accent2:#e6c173; --chip:#c69a3f;
    --hero:linear-gradient(135deg,#272118,#17130d); --hero-ink:#e6c173;
    --display:"Georgia","Times New Roman",serif; --radius:18px;
  }
  [data-tema="terracota"]{
    --ink:#3e2b20; --muted:#8a7566; --line:#efe1d3; --bg:#fbf4ec; --surface:#ffffff;
    --accent:#c15b32; --accent2:#9c3f1d; --chip:#b4663b;
    --hero:linear-gradient(135deg,#d2683a,#9c3f1d); --hero-ink:#fff6ef;
    --display:"Georgia","Times New Roman",serif; --radius:18px;
  }
  [data-tema="marino"]{
    --ink:#11303f; --muted:#5d7585; --line:#dce7ef; --bg:#eef3f7; --surface:#ffffff;
    --accent:#1f7a95; --accent2:#134b5c; --chip:#2b86a0;
    --hero:linear-gradient(135deg,#2a8ba7,#113f4f); --hero-ink:#f0f8fb;
    --display:"Georgia","Times New Roman",serif; --radius:18px;
  }
  [data-tema="vino"]{
    --ink:#3a1620; --muted:#8a6670; --line:#ecdcdf; --bg:#f7f0f1; --surface:#ffffff;
    --accent:#8a2437; --accent2:#5e1826; --chip:#9c3346;
    --hero:linear-gradient(135deg,#9a2a3e,#5e1826); --hero-ink:#fbeef0;
    --display:"Georgia","Times New Roman",serif; --radius:18px;
  }
  [data-tema="minimal"]{
    --ink:#161616; --muted:#8a8a8a; --line:#ececec; --bg:#ffffff; --surface:#ffffff;
    --accent:#161616; --accent2:#000000; --chip:#555555;
    --hero:#161616; --hero-ink:#ffffff;
    --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; --radius:12px;
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; transition:background .25s,color .25s; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 16px 120px; }

  /* Hero */
  header{ position:relative; overflow:hidden; text-align:center; background:var(--hero); color:var(--hero-ink);
    border-radius:var(--radius); padding:30px 22px 22px; box-shadow:0 14px 34px rgba(0,0,0,.14); }
  header::after{ content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.08); }
  header .eyebrow{ position:relative; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; opacity:.8; }
  header h1{ position:relative; font-family:var(--display); font-weight:600; font-size:30px; line-height:1.1; margin:9px 0 3px; letter-spacing:-.01em; }
  header .sub{ position:relative; font-size:12.5px; opacity:.82; }
  .mesa-chip{ position:relative; display:inline-block; margin-top:12px; background:rgba(255,255,255,.18); color:var(--hero-ink); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:4px 13px; font-size:12.5px; font-weight:700; }
  .langs{ position:relative; display:flex; gap:7px; justify-content:center; margin:16px 0 0; }
  .langs button{ border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:var(--hero-ink); border-radius:999px; padding:6px 15px; font-size:13px; font-weight:800; cursor:pointer; backdrop-filter:blur(2px); }
  .langs button.on{ background:var(--hero-ink); border-color:var(--hero-ink); color:var(--accent2); }

  .avisos{ display:flex; gap:10px; margin:16px 0 0; }
  .avisos button{ flex:1; border:1px solid var(--line); background:var(--surface); color:var(--accent2); border-radius:14px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .avisos button:active{ transform:scale(.98); }

  /* Categorías como tarjetas */
  .cat{ margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6px 16px 4px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .cat h2{ font-family:var(--display); font-weight:600; font-size:20px; margin:16px 0 2px; color:var(--accent); display:flex; align-items:center; gap:10px; }
  .cat h2::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
  .item{ display:flex; align-items:flex-start; gap:13px; padding:14px 0; border-top:1px solid var(--line); }
  .item:first-of-type{ border-top:none; }
  .item.ago{ opacity:.5; }
  .item.ago .foto{ filter:grayscale(1); }
  .ago-tag{ display:inline-block; font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 11px; white-space:nowrap; }
  .item .foto{ width:72px; height:72px; border-radius:14px; object-fit:cover; flex:none; background:var(--line); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .item .info{ flex:1; min-width:0; }
  .item .n{ font-size:16px; font-weight:650; letter-spacing:-.01em; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .badge.rec{ color:#a86b00; background:rgba(214,158,46,.16); border:1px solid rgba(214,158,46,.45); }
  .badge.pic{ color:#c0392b; background:rgba(214,70,54,.14); border:1px solid rgba(214,70,54,.45); }
  .item .d{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .aler{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .aler .chip{ font-size:10px; font-weight:700; color:var(--chip); background:color-mix(in srgb, var(--chip) 12%, transparent); border:1px solid color-mix(in srgb, var(--chip) 35%, transparent); border-radius:999px; padding:2px 9px; line-height:1.6; text-transform:uppercase; letter-spacing:.02em; }
  .item .price{ margin-top:7px; font-weight:750; font-size:15px; color:var(--ink); }
  .item .right{ display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:6px; align-self:center; }
  .item .p{ font-weight:750; font-size:15px; white-space:nowrap; }
  .add{ width:38px; height:38px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-size:23px; line-height:1; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.18); }
  [data-tema="minimal"] .add, [data-tema="noche"] .add{ color:var(--bg); }
  .add:active{ transform:scale(.92); }
  .qty{ display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .qty button{ width:34px; height:34px; border:0; background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; }
  .qty span{ min-width:26px; text-align:center; font-weight:700; font-size:14px; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:26px; opacity:.8; }
  .estado{ text-align:center; color:var(--muted); padding:60px 20px; }

  /* Barra flotante del carrito */
  .cartbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:none; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 30%); }
  .cartbar .inner{ max-width:560px; margin:0 auto; }
  .cartbar button{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; border:none; background:var(--accent); color:#fff; border-radius:16px; padding:16px 18px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 12px 30px rgba(0,0,0,.26); }
  [data-tema="minimal"] .cartbar button, [data-tema="noche"] .cartbar button{ color:var(--bg); }
  .cartbar .badge{ background:rgba(255,255,255,.26); border-radius:999px; padding:3px 11px; font-size:14px; }
  [data-tema="minimal"] .cartbar .badge, [data-tema="noche"] .cartbar .badge{ background:rgba(0,0,0,.18); }
  /* Hoja del pedido */
  .sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:none; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface); border-radius:22px 22px 0 0; max-width:560px; margin:0 auto; max-height:86vh; display:none; flex-direction:column; }
  .sheet-head{ padding:18px 20px 10px; font-family:var(--display); font-size:20px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .sheet-head .x{ border:none; background:none; font-size:24px; color:var(--muted); cursor:pointer; }
  .sheet-body{ padding:0 20px; overflow:auto; }
  .cline{ padding:12px 0; border-bottom:1px solid var(--line); }
  .cline .top{ display:flex; align-items:center; gap:10px; }
  .cline .cn{ flex:1; font-weight:650; font-size:15px; }
  .cline .cp{ font-weight:750; white-space:nowrap; }
  .cline input{ width:100%; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13.5px; background:var(--bg); color:var(--ink); }
  .sheet-foot{ padding:14px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .sheet-foot .tot{ display:flex; justify-content:space-between; font-size:18px; font-weight:800; margin-bottom:12px; }
  .send{ width:100%; border:none; background:var(--accent); color:#fff; border-radius:14px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; }
  [data-tema="minimal"] .send, [data-tema="noche"] .send{ color:var(--bg); }
  .send:disabled{ opacity:.5; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--accent2); color:#fff; padding:13px 20px; border-radius:12px; font-weight:600; font-size:14px; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.28); max-width:90%; text-align:center; }
  .ok-splash{ text-align:center; padding:50px 24px; }
  .ok-splash .circ{ width:72px; height:72px; border-radius:50%; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); display:grid; place-items:center; margin:0 auto 18px; font-size:38px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="estado">Cargando la carta…</div></div>
  <div class="cartbar" id="cartbar"><div class="inner"><button onclick="abrirPedido()"><span id="cartTxt"></span><span class="badge" id="cartTot"></span></button></div></div>
  <div class="sheet-bg" id="sheetBg" onclick="cerrarPedido()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head"><span id="sheetTitle"></span><button class="x" onclick="cerrarPedido()">×</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
<script>
  const P = new URLSearchParams(location.search);
  const E = P.get("e"), M = P.get("m"), TK = P.get("t");
  const pedirActivo = !!(E && M && TK);
  const wrap = document.getElementById("wrap");

  const TEMAS = ["verde","noche","terracota","marino","vino","minimal"];
  function aplicarTema(tm){ document.documentElement.setAttribute("data-tema", TEMAS.includes(tm)?tm:"verde"); }
  aplicarTema(P.get("tema"));   // tema inicial (preview) hasta que llegue el de la empresa

  const STR = {
    es:{ carta:"Carta", iva:"Precios con IVA incluido", pedido:"Tu pedido", vacio:"Aún no has añadido nada.", enviar:"Enviar pedido", enviando:"Enviando…", enviado:"¡Pedido enviado!", enviadoSub:"El camarero lo confirmará enseguida.", nota:"Nota para cocina (opcional)", llamar:"Llamar al camarero", cuenta:"Pedir la cuenta", avisado:"Aviso enviado, ahora te atienden.", total:"Total", mesa:"Mesa", ver:"Ver pedido", art:"artículo", arts:"artículos", errCarga:"No se pudo cargar la carta.", errEnvio:"No se pudo enviar. Inténtalo de nuevo.", sinCarta:"La carta aún no está disponible.", seguir:"Seguir pidiendo", rec:"Recomendado", pic:"Picante", agotado:"Agotado" },
    en:{ carta:"Menu", iva:"Prices include VAT", pedido:"Your order", vacio:"You haven't added anything yet.", enviar:"Send order", enviando:"Sending…", enviado:"Order sent!", enviadoSub:"The waiter will confirm it shortly.", nota:"Note for the kitchen (optional)", llamar:"Call the waiter", cuenta:"Ask for the bill", avisado:"Sent, the waiter is on the way.", total:"Total", mesa:"Table", ver:"View order", art:"item", arts:"items", errCarga:"Couldn't load the menu.", errEnvio:"Couldn't send. Please try again.", sinCarta:"The menu isn't available yet.", seguir:"Keep ordering", rec:"Recommended", pic:"Spicy", agotado:"Sold out" },
    fr:{ carta:"Carte", iva:"Prix TVA comprise", pedido:"Votre commande", vacio:"Vous n'avez rien ajouté.", enviar:"Envoyer la commande", enviando:"Envoi…", enviado:"Commande envoyée !", enviadoSub:"Le serveur va la confirmer.", nota:"Note pour la cuisine (facultatif)", llamar:"Appeler le serveur", cuenta:"Demander l'addition", avisado:"Envoyé, le serveur arrive.", total:"Total", mesa:"Table", ver:"Voir la commande", art:"article", arts:"articles", errCarga:"Impossible de charger la carte.", errEnvio:"Envoi impossible. Réessayez.", sinCarta:"La carte n'est pas encore disponible.", seguir:"Continuer", rec:"Recommandé", pic:"Épicé", agotado:"Épuisé" },
  };
  const LANGS = [["es","ES"],["en","EN"],["fr","FR"]];
  // Nombres de los 14 alérgenos (Reglamento UE 1169/2011) en cada idioma.
  const ALER = {
    Gluten:{es:"Gluten",en:"Gluten",fr:"Gluten"}, Crustaceos:{es:"Crustáceos",en:"Crustaceans",fr:"Crustacés"},
    Huevos:{es:"Huevos",en:"Eggs",fr:"Œufs"}, Pescado:{es:"Pescado",en:"Fish",fr:"Poisson"},
    Cacahuetes:{es:"Cacahuetes",en:"Peanuts",fr:"Arachides"}, Soja:{es:"Soja",en:"Soy",fr:"Soja"},
    Lacteos:{es:"Lácteos",en:"Dairy",fr:"Lait"}, FrutosCascara:{es:"Frutos de cáscara",en:"Tree nuts",fr:"Fruits à coque"},
    Apio:{es:"Apio",en:"Celery",fr:"Céleri"}, Mostaza:{es:"Mostaza",en:"Mustard",fr:"Moutarde"},
    Sesamo:{es:"Sésamo",en:"Sesame",fr:"Sésame"}, Sulfitos:{es:"Sulfitos",en:"Sulphites",fr:"Sulfites"},
    Altramuces:{es:"Altramuces",en:"Lupin",fr:"Lupin"}, Moluscos:{es:"Moluscos",en:"Molluscs",fr:"Mollusques"},
  };
  const alerLabel = a => (ALER[a] && ALER[a][lang]) || a;
  let lang = (()=>{ try{ return localStorage.getItem("bq_carta_lang"); }catch{} })()
    || (P.get("l")) || (navigator.language||"es").slice(0,2).toLowerCase();
  if(!STR[lang]) lang = "es";
  let t = STR[lang];

  let carta = null;                 // datos de la carta
  const cart = new Map();           // id -> {id, nombre, precio, cantidad, nota}
  let mesaNombre = "";

  const eur = n => (Number(n)||0).toLocaleString(lang==="es"?"es-ES":lang==="fr"?"fr-FR":"en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }

  async function cargar(){
    if(!E){ wrap.innerHTML = '<div class="estado">Carta no encontrada.</div>'; return; }
    try{
      const r = await fetch(`/carta/${E}/datos?idioma=${lang}`);
      if(!r.ok) throw new Error();
      carta = await r.json();
      aplicarTema(P.get("tema") || carta.tema);
      document.title = carta.local ? `${t.carta} · ${carta.local}` : t.carta;
      pintar();
    }catch(e){ wrap.innerHTML = `<div class="estado">${esc(t.errCarga)}</div>`; }
  }

  function pintar(){
    t = STR[lang];
    const langBtns = LANGS.map(([code,lbl])=>`<button class="${code===lang?"on":""}" onclick="setLang('${code}')">${lbl}</button>`).join("");
    const head = `<header>
        <div class="eyebrow">${esc(t.carta)}</div>
        <h1>${esc(carta.local||"")}</h1>
        <div class="sub">${esc(t.iva)}</div>
        ${mesaNombre?`<div class="mesa-chip">${esc(t.mesa)} · ${esc(mesaNombre)}</div>`:""}
        <div class="langs">${langBtns}</div>
      </header>`;
    if(!carta.categorias || !carta.categorias.length){ wrap.innerHTML = head + `<div class="estado">${esc(t.sinCarta)}</div>`; sincronizarBarra(); return; }
    const avisos = pedirActivo ? `<div class="avisos"><button onclick="avisar('LlamarCamarero')">🙋 ${esc(t.llamar)}</button><button onclick="avisar('PedirCuenta')">🧾 ${esc(t.cuenta)}</button></div>` : "";
    const cats = carta.categorias.map(cat=>`
      <section class="cat"><h2>${esc(cat.nombre)}</h2><div class="rule"></div>
        ${cat.items.map(it=>fila(it)).join("")}
      </section>`).join("");
    wrap.innerHTML = head + avisos + cats + `<footer>Bar Query</footer>`;
    sincronizarBarra();
  }

  function fila(it){
    const ctl = it.agotado ? `<span class="ago-tag">${esc(t.agotado)}</span>` : (pedirActivo ? control(it) : "");
    const foto = it.foto ? `<img class="foto" src="${esc(it.foto)}" alt="" loading="lazy">` : "";
    const aler = (it.alergenos && it.alergenos.length) ? `<div class="aler">${it.alergenos.map(a=>`<span class="chip">${esc(alerLabel(a))}</span>`).join("")}</div>` : "";
    const dist = (it.recomendado?`<span class="badge rec">⭐ ${esc(t.rec)}</span>`:"") + (it.picante?`<span class="badge pic">🌶️ ${esc(t.pic)}</span>`:"");
    return `<div class="item${it.agotado?" ago":""}" id="it_${it.id}">
      ${foto}
      <div class="info"><div class="n">${esc(it.nombre)}${dist}</div>${it.descripcion?`<div class="d">${esc(it.descripcion)}</div>`:""}${aler}<div class="price">${eur(it.precio)}</div></div>
      <div class="right">${ctl}</div></div>`;
  }
  function control(it){
    const c = cart.get(it.id);
    if(!c) return `<button class="add" onclick='addItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>+</button>`;
    return `<div class="qty"><button onclick="menos('${it.id}')">−</button><span>${c.cantidad}</span><button onclick="mas('${it.id}')">+</button></div>`;
  }
  function repintarItem(it){ const n=document.getElementById("it_"+it.id); if(n){ n.querySelector(".right").innerHTML = control(it); } }

  window.addItem = it => { cart.set(it.id, {id:it.id, nombre:it.nombre, precio:it.precio, cantidad:1, nota:""}); repintarItem(it); sincronizarBarra(); };
  window.mas = id => { const c=cart.get(id); if(c){ c.cantidad++; repintarItem(itDe(id)); sincronizarBarra(); } };
  window.menos = id => { const c=cart.get(id); if(!c) return; c.cantidad--; if(c.cantidad<=0) cart.delete(id); repintarItem(itDe(id)); sincronizarBarra(); if(!cart.size && document.getElementById("sheet").style.display==="flex") pintarPedido(); else if(document.getElementById("sheet").style.display==="flex") pintarPedido(); };
  function itDe(id){ for(const cat of (carta.categorias||[])) for(const it of cat.items) if(it.id===id) return it; return {id}; }

  function totalCent(){ let c=0; for(const l of cart.values()) c += Math.round(l.precio*100)*l.cantidad; return c; }
  function unidades(){ let n=0; for(const l of cart.values()) n+=l.cantidad; return n; }

  function sincronizarBarra(){
    const bar=document.getElementById("cartbar"); const n=unidades();
    if(!pedirActivo || n===0){ bar.style.display="none"; return; }
    bar.style.display="block";
    document.getElementById("cartTxt").textContent = `${t.ver} · ${n} ${n===1?t.art:t.arts}`;
    document.getElementById("cartTot").textContent = eur(totalCent()/100);
  }

  window.setLang = code => { if(code===lang) return; lang=code; try{ localStorage.setItem("bq_carta_lang",code); }catch{} cargar(); };

  window.abrirPedido = () => { pintarPedido(); document.getElementById("sheetBg").style.display="block"; document.getElementById("sheet").style.display="flex"; };
  window.cerrarPedido = () => { document.getElementById("sheetBg").style.display="none"; document.getElementById("sheet").style.display="none"; };

  function pintarPedido(){
    document.getElementById("sheetTitle").textContent = t.pedido;
    const body=document.getElementById("sheetBody"), foot=document.getElementById("sheetFoot");
    if(!cart.size){ body.innerHTML = `<div class="estado">${esc(t.vacio)}</div>`; foot.innerHTML=""; return; }
    body.innerHTML = [...cart.values()].map(l=>`
      <div class="cline">
        <div class="top"><span class="cn">${esc(l.nombre)}</span>
          <div class="qty"><button onclick="menos('${l.id}')">−</button><span>${l.cantidad}</span><button onclick="mas('${l.id}')">+</button></div>
          <span class="cp">${eur(l.precio*l.cantidad)}</span></div>
        <input type="text" placeholder="${esc(t.nota)}" value="${esc(l.nota)}" oninput="setNota('${l.id}',this.value)">
      </div>`).join("");
    foot.innerHTML = `<div class="tot"><span>${esc(t.total)}</span><span>${eur(totalCent()/100)}</span></div>
      <button class="send" id="sendBtn" onclick="enviar()">${esc(t.enviar)}</button>`;
  }
  window.setNota = (id,v) => { const c=cart.get(id); if(c) c.nota=v; };

  window.enviar = async () => {
    if(!cart.size) return;
    const btn=document.getElementById("sendBtn"); if(btn){ btn.disabled=true; btn.textContent=t.enviando; }
    const items=[...cart.values()].map(l=>({productoId:l.id, cantidad:l.cantidad, nota:l.nota||null}));
    try{
      const r=await fetch(`/carta/${E}/mesa/${M}/pedido`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TK,idioma:lang,items})});
      if(!r.ok) throw new Error();
      cart.clear(); sincronizarBarra();
      document.getElementById("sheetBody").innerHTML = `<div class="ok-splash"><div class="circ">✓</div><h2 style="font-family:var(--display);margin:0 0 6px">${esc(t.enviado)}</h2><p style="color:var(--muted);margin:0">${esc(t.enviadoSub)}</p></div>`;
      document.getElementById("sheetFoot").innerHTML = `<button class="send" onclick="cerrarPedido()">${esc(t.seguir)}</button>`;
    }catch(e){ if(btn){ btn.disabled=false; btn.textContent=t.enviar; } toast(t.errEnvio); }
  };

  window.avisar = async tipo => {
    try{
      const r=await fetch(`/carta/${E}/mesa/${M}/aviso`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TK,tipo})});
      if(!r.ok) throw new Error();
      toast(t.avisado);
    }catch(e){ toast(t.errEnvio); }
  };

  cargar();
</script>
</body>
</html>
