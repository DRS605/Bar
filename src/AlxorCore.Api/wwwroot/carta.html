<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta</title>
<style>
  :root{ --ink:#17251e; --muted:#5f7168; --line:#e6ede9; --bg:#f4f6f4; --surface:#fff; --accent:#1f7a5a; --copper:#c67b3a; --display:"Georgia","Times New Roman",serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 18px 48px; }
  header{ text-align:center; padding:34px 18px 22px; }
  header .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--copper); }
  header h1{ font-family:var(--display); font-weight:600; font-size:30px; margin:8px 0 2px; letter-spacing:-.01em; }
  header .sub{ color:var(--muted); font-size:13.5px; }
  .cat{ margin-top:26px; }
  .cat h2{ font-family:var(--display); font-weight:600; font-size:20px; margin:0 0 4px; color:var(--accent); }
  .cat .rule{ height:2px; background:linear-gradient(90deg,var(--accent),transparent); border-radius:2px; margin-bottom:6px; }
  .item{ display:flex; align-items:baseline; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .item .n{ flex:1; font-size:15.5px; }
  .item .dots{ flex:1; border-bottom:1px dotted #c3d0c9; transform:translateY(-4px); min-width:16px; }
  .item .p{ font-weight:700; font-size:15.5px; white-space:nowrap; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:34px; }
  .estado{ text-align:center; color:var(--muted); padding:60px 20px; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9f1ec; --muted:#9fb2a8; --line:#26332c; --bg:#121a16; --surface:#18211c; --accent:#4fb488; }
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="estado">Cargando la carta…</div></div>
<script>
  const eur = n => (Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const id = new URLSearchParams(location.search).get("e");
  const wrap = document.getElementById("wrap");
  (async () => {
    if(!id){ wrap.innerHTML = '<div class="estado">Carta no encontrada.</div>'; return; }
    try{
      const r = await fetch(`/carta/${id}/datos`);
      if(!r.ok) throw new Error();
      const c = await r.json();
      document.title = c.local ? `Carta · ${c.local}` : "Carta";
      if(!c.categorias || !c.categorias.length){ wrap.innerHTML = `<header><h1>${esc(c.local||"Carta")}</h1></header><div class="estado">La carta aún no está disponible.</div>`; return; }
      const cats = c.categorias.map(cat => `
        <section class="cat"><h2>${esc(cat.nombre)}</h2><div class="rule"></div>
          ${cat.items.map(it => `<div class="item"><span class="n">${esc(it.nombre)}</span><span class="dots"></span><span class="p">${eur(it.precio)}</span></div>`).join("")}
        </section>`).join("");
      wrap.innerHTML = `<header><div class="eyebrow">Carta</div><h1>${esc(c.local||"")}</h1><div class="sub">Precios con IVA incluido</div></header>${cats}<footer>Bar Query</footer>`;
    }catch(e){
      wrap.innerHTML = '<div class="estado">No se pudo cargar la carta. Inténtalo de nuevo.</div>';
    }
  })();
</script>
</body>
</html>
