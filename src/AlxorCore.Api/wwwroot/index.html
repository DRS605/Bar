<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALXOR · Core One</title>
  <style>
    :root {
      /* Paleta: cian de acento contrastado con azul marino en el texto. */
      --ink: #0b2a4a; --muted: #5c7186; --line: #e5ebf1; --bg: #f1f6f9; --surface: #ffffff;
      --brand1: #17b6d6; --brand2: #0b6ea4; --accent: #0d94ba; --accent-soft: #e2f5fb;
      --navy: #0b2a4a;
      --pos: #0f9d58; --neg: #e0533d; --warn: #c07d1a;
      --radius: 16px; --shadow: 0 1px 2px rgba(11,42,74,.05), 0 6px 18px rgba(11,42,74,.06);
      --grad: linear-gradient(135deg, #1cbcda, #0b5f96);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }

    /* Brand mark */
    .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--grad); position: relative; flex: none;
      box-shadow: 0 4px 10px rgba(91,91,214,.35); }
    .mark::after { content:""; position:absolute; inset: 9px; border: 2.5px solid #fff; border-radius: 50%; border-right-color: transparent; }
    .wordmark { display:flex; align-items:center; gap: 11px; font-weight: 750; font-size: 19px; letter-spacing: -.02em; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand1);
      background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }

    /* ---------- LOGIN (split) ---------- */
    .login { display: grid; grid-template-columns: 1.05fr .95fr; min-height: 100vh; }
    .login .promo { background: var(--grad); color: #fff; padding: 56px 60px; display:flex; flex-direction:column; position: relative; overflow: hidden; }
    .login .promo::before { content:""; position:absolute; width: 520px; height: 520px; right: -180px; top: -160px; background: rgba(255,255,255,.10); border-radius: 50%; }
    .login .promo::after { content:""; position:absolute; width: 340px; height: 340px; left: -120px; bottom: -140px; background: rgba(255,255,255,.08); border-radius: 50%; }
    .promo .wordmark { color:#fff; position: relative; }
    .promo .mark { background: rgba(255,255,255,.16); box-shadow: none; }
    .promo .mark::after { border-color:#fff; border-right-color: transparent; }
    .promo .tag { color:#fff; background: rgba(255,255,255,.18); }
    .promo h2 { font-size: 34px; line-height: 1.15; letter-spacing: -.03em; margin: auto 0 14px; max-width: 460px; position: relative; }
    .promo p.lead { font-size: 15px; opacity: .92; max-width: 420px; margin: 0 0 30px; position: relative; }
    .promo ul { list-style: none; padding: 0; margin: 0 0 8px; position: relative; }
    .promo li { display:flex; align-items:center; gap: 10px; padding: 7px 0; font-size: 14px; opacity: .95; }
    .promo li svg { width: 18px; height: 18px; flex:none; }
    .login .panel { display:grid; place-items:center; padding: 24px; }
    .login-card { width: 100%; max-width: 360px; }
    .login-card h1 { font-size: 22px; letter-spacing: -.02em; margin: 6px 0 4px; }
    .login-card .sub { color: var(--muted); margin: 0 0 24px; }
    label { display:block; font-size: 12.5px; color: var(--muted); margin: 14px 0 6px; font-weight: 500; }
    input, select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background:#fff; font-size: 14px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background: var(--grad); color:#fff; border:none; border-radius:11px; padding: 12px 16px; font-weight:650; font-size:14px; width:100%; margin-top: 22px; box-shadow: 0 6px 16px rgba(91,91,214,.28); }
    .btn:hover { filter: brightness(1.03); }
    .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:none; width:auto; margin:0; padding:10px 15px; }
    .btn.small { width:auto; margin:0; padding: 9px 15px; font-size: 13.5px; }
    .btn.ghost { background: var(--accent-soft); color: var(--accent); box-shadow:none; }
    .error { color: var(--neg); font-size: 12.5px; margin-top: 12px; min-height: 16px; }

    /* ---------- APP shell ---------- */
    .app { display:none; grid-template-columns: 248px 1fr; min-height: 100vh; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display:flex; flex-direction:column; }
    .sidebar .head { display:flex; align-items:center; justify-content:space-between; padding: 4px 8px 20px; }
    .navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9aa0a6; padding: 4px 12px 8px; font-weight: 600; }
    nav a { display:flex; align-items:center; gap:11px; padding: 9px 12px; border-radius: 11px; color: var(--muted); font-weight:550; margin-bottom: 2px; position: relative; }
    nav a svg { width: 18px; height: 18px; stroke: currentColor; fill:none; stroke-width: 1.8; }
    nav a:hover { background:#f5f6f8; color: var(--ink); }
    nav a.active { background: var(--accent-soft); color: var(--accent); }
    nav a.active::before { content:""; position:absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; background: var(--grad); border-radius: 0 3px 3px 0; }
    .navhead { display:flex; align-items:center; gap:11px; padding: 9px 12px; border-radius: 11px; color: var(--muted); font-weight: 650; cursor: pointer; user-select:none; }
    .navhead > svg:first-child { width:18px; height:18px; stroke: currentColor; fill:none; stroke-width:1.8; }
    .navhead:hover { background:#f0f5f8; color: var(--ink); }
    .navhead .chev { width:15px; height:15px; margin-left:auto; stroke: currentColor; fill:none; stroke-width:2; opacity:.55; transition: transform .18s; }
    .navgroup.closed .chev { transform: rotate(-90deg); }
    .subnav { overflow:hidden; max-height: 320px; transition: max-height .2s ease; }
    .navgroup.closed .subnav { max-height: 0; }
    nav a.navsub { padding: 8px 12px 8px 40px; font-weight: 540; margin-bottom: 1px; }
    .sidebar .spacer { flex:1; }
    .userbox { display:flex; align-items:center; gap:10px; padding: 10px; border-top: 1px solid var(--line); }
    .userbox .avatar { width:34px; height:34px; }
    .userbox .who { line-height: 1.25; }
    .userbox .who b { font-size: 13px; } .userbox .who span { font-size: 12px; color: var(--muted); }

    .main { display:flex; flex-direction:column; min-width:0; }
    .topbar { height: 66px; border-bottom: 1px solid var(--line); background: var(--surface); display:flex; align-items:center; justify-content:space-between; padding: 0 30px; }
    .topbar .title { font-size: 16px; font-weight: 680; letter-spacing:-.01em; }
    .company { display:flex; align-items:center; gap:10px; color:var(--muted); font-weight: 550; }
    .company .chip { display:flex; align-items:center; gap:8px; background:#f5f6f8; border:1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
    .avatar { width:32px; height:32px; border-radius:50%; background: var(--grad); color:#fff; display:grid; place-items:center; font-weight:650; font-size:13px; flex:none; }
    .content { padding: 28px 30px; max-width: 1120px; width: 100%; }

    .greet { margin-bottom: 22px; }
    .greet h1 { font-size: 24px; letter-spacing:-.02em; margin: 0 0 4px; }
    .greet p { color: var(--muted); margin: 0; }

    .kpis { display:grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 26px; }
    .kpi { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .kpi .top { display:flex; align-items:center; justify-content:space-between; }
    .kpi .chipico { width: 34px; height: 34px; border-radius: 10px; display:grid; place-items:center; background: var(--accent-soft); color: var(--accent); }
    .kpi .chipico svg { width: 18px; height: 18px; stroke: currentColor; fill:none; stroke-width: 1.9; }
    .kpi .lbl { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
    .kpi .val { font-size: 25px; font-weight: 760; letter-spacing:-.02em; margin-top: 4px; }
    .kpi.warn .chipico { background:#fdf1e5; color: var(--warn); }
    .kpi.pos .chipico { background:#e7f6ee; color: var(--pos); }
    .kpi .val.neg { color: var(--neg); }

    .panel { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
    .panel + .panel { margin-top: 18px; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 15px; margin:0; letter-spacing:-.01em; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding: 13px 20px; font-size: 13.5px; }
    th { color: var(--muted); font-weight:600; font-size: 11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); }
    tbody tr { border-bottom: 1px solid #f3f4f6; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:#fafbfc; }
    td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
    .pill { display:inline-block; padding: 3px 10px; border-radius:999px; font-size:11.5px; font-weight:650; }
    .pill.ok { background:#e7f6ee; color:var(--pos); } .pill.wait { background:#fdf2e3; color:var(--warn); } .pill.part { background: var(--accent-soft); color: var(--accent); }
    .muted { color: var(--muted); } .right { text-align:right; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing:.2px; }
    .avatar.mini { width:26px; height:26px; font-size:11px; border-radius: 8px; display:inline-grid; vertical-align:middle; margin-right:8px; }
    .empty { padding: 46px 20px; text-align:center; color: var(--muted); }
    .empty .big { width:52px; height:52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display:grid; place-items:center; margin: 0 auto 14px; }
    .empty .big svg { width: 24px; height: 24px; stroke: currentColor; fill:none; stroke-width: 1.7; }
    .empty h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink); }

    .modal-bg { position:fixed; inset:0; background: rgba(14,17,22,.4); display:none; place-items:center; padding: 24px; z-index: 30; }
    .modal { background:#fff; border-radius: 18px; width:100%; max-width: 560px; box-shadow: 0 24px 60px rgba(16,24,40,.28); }
    .modal-head { padding: 18px 22px; border-bottom:1px solid var(--line); font-weight:700; font-size:16px; }
    .modal-body { padding: 20px 22px; max-height: 64vh; overflow:auto; }
    .modal-foot { padding: 16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
    .row { display:grid; grid-template-columns: 1fr 88px 108px 104px; gap: 10px; align-items:end; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="promo">
      <div class="wordmark"><span class="mark"></span> ALXOR <span class="tag">Core One</span></div>
      <h2>La gestión de tu negocio, sin manual.</h2>
      <p class="lead">Factura, controla tus gastos y cobra a tiempo. Todo en un sitio, en menos clics.</p>
      <ul>
        <li>${'' /* placeholders replaced below */}</li>
      </ul>
    </div>
    <div class="panel">
      <div class="login-card">
        <div class="wordmark" style="margin-bottom:26px"><span class="mark"></span> ALXOR <span class="tag">Core One</span></div>
        <h1>Bienvenido de nuevo</h1>
        <p class="sub">Entra para gestionar tu empresa.</p>
        <label>Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" />
        <label>Contraseña</label>
        <input id="pass" type="password" autocomplete="current-password" />
        <button class="btn" onclick="entrar()">Entrar</button>
        <div class="error" id="loginError"></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="head"><div class="wordmark" style="font-size:17px"><span class="mark"></span> ALXOR</div><span class="tag">Core One</span></div>
      <div class="navlabel">Gestión</div>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <div class="userbox"><div class="avatar" id="sideAvatar">U</div><div class="who"><b id="sideNombre">Usuario</b><br><span id="sideEmpresa">—</span></div></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="title" id="viewTitle">Inicio</div>
        <div class="company"><span class="chip" id="empresaChip"></span><div class="avatar" id="avatar">U</div></div>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-head" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn small" id="modalOk" onclick="guardarModal()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let token=null, empresa=null, usuario=null, vista="inicio";
    const eur = n => (Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    const check = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';
    document.querySelector('.promo ul').innerHTML =
      ['Emite una factura en menos de 5 minutos','IVA e IRPF calculados por ti','Libros de IVA listos para tu gestoría']
      .map(t=>`<li>${check}${t}</li>`).join('');

    const ICON = {
      inicio:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
      facturas:'<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>',
      clientes:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
      productos:'<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>',
      gastos:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>',
      proveedores:'<svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>',
      cobros:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>',
      informes:'<svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 16v-5M13 16V8M18 16v-9"/></svg>'
    };
    ICON.ventas = '<svg viewBox="0 0 24 24"><path d="M3 6h18l-1.5 9H4.5z"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 6L2 3"/></svg>';
    ICON.compras = '<svg viewBox="0 0 24 24"><path d="M6 7V6a3 3 0 0 1 6 0v1"/><path d="M4 7h16l-1 13H5z"/></svg>';
    ICON.articulos = '<svg viewBox="0 0 24 24"><path d="M4 5v14M8 5v14M12 5v14M16 5v14M20 5v14"/></svg>';
    ICON.pagos = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>';

    // Menú agrupado en carpetas: Ventas, Compras y Artículos.
    const NAV = [
      { t:"item", k:"inicio", l:"Inicio" },
      { t:"grupo", k:"ventas", l:"Ventas", items:[["facturas","Facturas"],["clientes","Clientes"],["cobros","Cobros"]] },
      { t:"grupo", k:"compras", l:"Compras", items:[["gastos","Gastos"],["proveedores","Proveedores"],["pagos","Pagos"]] },
      { t:"grupo", k:"articulos", l:"Artículos", items:[["productos","Productos"]] },
      { t:"item", k:"informes", l:"Informes" },
    ];
    const TITULOS = { inicio:"Inicio", facturas:"Facturas", clientes:"Clientes", cobros:"Cobros", gastos:"Gastos", proveedores:"Proveedores", pagos:"Pagos", productos:"Artículos", informes:"Informes" };
    function renderNav() {
      return NAV.map(n => {
        if (n.t === "item") return `<a class="navitem" data-k="${n.k}" onclick="ir('${n.k}')">${ICON[n.k]}<span>${n.l}</span></a>`;
        const links = n.items.map(([k,l]) => `<a class="navsub" data-k="${k}" onclick="ir('${k}')"><span>${l}</span></a>`).join("");
        return `<div class="navgroup" data-g="${n.k}"><div class="navhead" onclick="toggleGrupo('${n.k}')">${ICON[n.k]}<span>${n.l}</span><svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6"/></svg></div><div class="subnav">${links}</div></div>`;
      }).join("");
    }
    function toggleGrupo(g){ document.querySelector(`.navgroup[data-g="${g}"]`).classList.toggle("closed"); }

    async function api(path, opts={}) {
      const h = Object.assign({ "Content-Type":"application/json" }, opts.headers||{});
      if (token) h["Authorization"]="Bearer "+token;
      const r = await fetch(API+path, Object.assign({}, opts, { headers:h }));
      if (!r.ok){ let m=""; try{m=(await r.json()).title||""}catch{}; throw new Error(m||("HTTP "+r.status)); }
      const ct = r.headers.get("content-type")||""; return ct.includes("json") ? r.json() : r.text();
    }

    async function entrar() {
      const email=document.getElementById("email").value.trim(), pass=document.getElementById("pass").value;
      const err=document.getElementById("loginError"); err.textContent="";
      try {
        const login=await api("/auth/login",{method:"POST",body:JSON.stringify({email,contrasena:pass})});
        token=login.token; usuario=login.usuario;
        const empresas=await api("/empresas");
        if(!empresas.length){ err.textContent="Tu usuario no tiene ninguna empresa."; return; }
        const sel=await api("/empresas/"+empresas[0].id+"/seleccionar",{method:"POST"});
        token=sel.token; empresa=empresas[0]; arrancar();
      } catch(e){ err.textContent=e.message||"No se pudo iniciar sesión."; }
    }

    function arrancar() {
      document.getElementById("login").style.display="none";
      document.getElementById("app").style.display="grid";
      const ini=(usuario?.nombre||"U").slice(0,1).toUpperCase();
      document.getElementById("avatar").textContent=ini;
      document.getElementById("sideAvatar").textContent=ini;
      document.getElementById("sideNombre").textContent=usuario?.nombre||"Usuario";
      document.getElementById("sideEmpresa").textContent=empresa.razonSocial;
      document.getElementById("empresaChip").innerHTML=`<span class="avatar mini">${empresa.razonSocial.slice(0,1)}</span>${empresa.razonSocial}`;
      document.getElementById("nav").innerHTML=renderNav();
      ir("inicio");
    }

    function ir(k){ vista=k;
      document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.k===k));
      document.getElementById("viewTitle").textContent=TITULOS[k]||k;
      ({inicio:vInicio,facturas:vFacturas,clientes:vClientes,productos:vProductos,gastos:vGastos,proveedores:vProveedores,cobros:vCobros,pagos:vPagos,informes:vInformes}[k])();
    }
    const view = h => document.getElementById("view").innerHTML=h;
    const panel = (t,c,a="") => `<div class="panel"><div class="panel-head"><h2>${t}</h2>${a}</div>${c}</div>`;
    const vacio = (ico,titulo,texto,accion="") => `<div class="empty"><div class="big">${ICON[ico]}</div><h3>${titulo}</h3><p>${texto}</p><div style="margin-top:16px">${accion}</div></div>`;
    const kIcon = { fact:'<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M9 13h6M9 17h6"/></svg>', cobro:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg>', gasto:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>', pago:'<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M4 11h16"/></svg>' };

    async function vInicio() {
      view('<div class="muted">Cargando…</div>');
      const [d,facturas]=await Promise.all([api("/informes/dashboard"),api("/facturas")]);
      const fecha=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
      const hora=new Date().getHours(); const saludo=hora<13?"Buenos días":hora<20?"Buenas tardes":"Buenas noches";
      const greet=`<div class="greet"><h1>${saludo}, ${(usuario?.nombre||"").split(" ")[0]} 👋</h1><p>${fecha.charAt(0).toUpperCase()+fecha.slice(1)} · Este es el resumen de ${empresa.razonSocial}.</p></div>`;
      const kpis=`<div class="kpis">
        <div class="kpi"><div class="top"><div class="chipico">${kIcon.fact}</div></div><div class="lbl">Facturado este mes</div><div class="val">${eur(d.facturadoMes)}</div></div>
        <div class="kpi warn"><div class="top"><div class="chipico">${kIcon.cobro}</div></div><div class="lbl">Pendiente de cobro</div><div class="val ${d.pendienteCobro>0?'neg':''}">${eur(d.pendienteCobro)}</div></div>
        <div class="kpi"><div class="top"><div class="chipico">${kIcon.gasto}</div></div><div class="lbl">Gastos este mes</div><div class="val">${eur(d.gastadoMes)}</div></div>
        <div class="kpi pos"><div class="top"><div class="chipico">${kIcon.pago}</div></div><div class="lbl">Pendiente de pago</div><div class="val">${eur(d.pendientePago)}</div></div></div>`;
      const filas=facturas.slice(0,6).map(f=>`<tr><td><strong>${f.numeroCompleto}</strong></td><td>${f.clienteNombre}</td><td class="muted">${f.fechaEmision}</td><td class="num"><strong>${eur(f.total)}</strong></td><td class="right"><span class="pill ok">${f.estado}</span></td></tr>`).join("");
      const tabla=facturas.length?`<table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th class="num">Total</th><th class="right">Estado</th></tr></thead><tbody>${filas}</tbody></table>`
        :vacio("facturas","Aún no has emitido facturas","Crea tu primera factura y cóbrala en un minuto.",`<button class="btn small" onclick="ir('facturas')">Ir a facturas</button>`);
      view(greet+kpis+panel("Últimas facturas",tabla));
    }

    async function vFacturas() {
      view('<div class="muted">Cargando…</div>');
      const fs=await api("/facturas");
      const filas=fs.map(f=>`<tr><td><strong>${f.numeroCompleto}</strong></td><td>${f.clienteNombre}</td><td class="muted">${f.fechaEmision}</td><td class="num">${eur(f.baseImponible)}</td><td class="num">${eur(f.cuotaIva)}</td><td class="num"><strong>${eur(f.total)}</strong></td><td class="right"><span class="pill ok">${f.estado}</span></td></tr>`).join("");
      const cuerpo=fs.length?`<table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th class="num">Base</th><th class="num">IVA</th><th class="num">Total</th><th class="right">Estado</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("facturas","Todavía no hay facturas","Emite la primera; el número y los impuestos los ponemos nosotros.",`<button class="btn small" onclick="modalFactura()">+ Nueva factura</button>`);
      view(panel("Facturas emitidas",cuerpo,`<button class="btn small" onclick="modalFactura()">+ Nueva factura</button>`));
    }
    async function vClientes() {
      view('<div class="muted">Cargando…</div>');
      const cs=await api("/clientes");
      const ini = n => `<span class="avatar mini">${(n||'?').slice(0,1).toUpperCase()}</span>`;
      const filas=cs.map(c=>`<tr><td>${ini(c.nombre)}<strong>${c.nombre}</strong></td><td class="muted">${c.nifFiscal||"—"}</td><td class="muted">${c.email||"—"}</td><td class="num">${c.porcentajeIrpfDefecto>0?c.porcentajeIrpfDefecto+"%":"—"}</td></tr>`).join("");
      const cuerpo=cs.length?`<table><thead><tr><th>Nombre</th><th>NIF</th><th>Email</th><th class="num">IRPF</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("clientes","Sin clientes todavía","Añade tu primer cliente para poder facturarle.",`<button class="btn small" onclick="modalCliente()">+ Nuevo cliente</button>`);
      view(panel("Clientes",cuerpo,`<button class="btn small" onclick="modalCliente()">+ Nuevo cliente</button>`));
    }
    async function vProveedores() {
      view('<div class="muted">Cargando…</div>');
      const ps=await api("/proveedores");
      const ini = n => `<span class="avatar mini">${(n||'?').slice(0,1).toUpperCase()}</span>`;
      const filas=ps.map(p=>`<tr><td>${ini(p.nombre)}<strong>${p.nombre}</strong></td><td class="muted">${p.nifFiscal||"—"}</td><td class="muted">${p.email||"—"}</td><td class="num">${p.porcentajeIrpfDefecto>0?p.porcentajeIrpfDefecto+"%":"—"}</td></tr>`).join("");
      const cuerpo=ps.length?`<table><thead><tr><th>Nombre</th><th>NIF</th><th>Email</th><th class="num">IRPF</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("proveedores","Sin proveedores todavía","Da de alta a tus proveedores para asociarlos a tus gastos.",`<button class="btn small" onclick="modalProveedor()">+ Nuevo proveedor</button>`);
      view(panel("Proveedores",cuerpo,`<button class="btn small" onclick="modalProveedor()">+ Nuevo proveedor</button>`));
    }
    async function vProductos() {
      view('<div class="muted">Cargando…</div>');
      const ps=await api("/productos");
      const filas=ps.map(p=>`<tr data-b="${(p.nombre+' '+(p.referencia||'')).toLowerCase()}"><td><strong>${p.nombre}</strong></td><td class="muted mono">${p.referencia||"—"}</td><td class="muted">${p.tipo}</td><td class="num">${eur(p.precioUnitario)}</td><td class="num">${p.porcentajeIva}%</td></tr>`).join("");
      const acciones=`<div style="display:flex;gap:10px;align-items:center"><input id="prodBuscar" placeholder="Buscar por nombre o código…" style="max-width:240px;padding:8px 12px" oninput="filtrarProductos()"/><button class="btn small" onclick="modalProducto()">+ Nuevo</button></div>`;
      const cuerpo=ps.length?`<table><thead><tr><th>Artículo</th><th>Código / EAN</th><th>Tipo</th><th class="num">Precio</th><th class="num">IVA</th></tr></thead><tbody id="prodBody">${filas}</tbody></table>`:vacio("articulos","Sin artículos todavía","Crea productos o servicios con su código para reutilizarlos al facturar.",`<button class="btn small" onclick="modalProducto()">+ Nuevo artículo</button>`);
      view(panel("Artículos",cuerpo,acciones));
    }
    function filtrarProductos(){ const q=document.getElementById("prodBuscar").value.toLowerCase().trim();
      document.querySelectorAll("#prodBody tr").forEach(tr=>{ tr.style.display=tr.dataset.b.includes(q)?"":"none"; }); }

    async function vPagos() {
      view('<div class="muted">Cargando…</div>');
      const gs=await api("/gastos");
      const saldos=await Promise.all(gs.map(g=>api("/gastos/"+g.id+"/saldo").catch(()=>null)));
      const filas=gs.map((g,i)=>{const s=saldos[i]||{}; const est=s.estado||"Pendiente"; const p=est==="Liquidado"?"ok":(est==="Parcial"?"part":"wait");
        return `<tr><td><strong>${g.concepto}</strong></td><td>${g.proveedorTexto||"—"}</td><td class="num">${eur(g.total)}</td><td class="num">${eur(s.liquidado||0)}</td><td class="num">${eur(s.pendiente??g.total)}</td><td class="right"><span class="pill ${p}">${est}</span></td></tr>`;}).join("");
      const cuerpo=gs.length?`<table><thead><tr><th>Concepto</th><th>Proveedor</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Pendiente</th><th class="right">Estado</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("pagos","Nada que pagar aún","Cuando registres gastos verás aquí su estado de pago.");
      view(panel("Pagos a proveedores",cuerpo));
    }
    async function vGastos() {
      view('<div class="muted">Cargando…</div>');
      const gs=await api("/gastos");
      const filas=gs.map(g=>`<tr><td><strong>${g.concepto}</strong></td><td class="muted">${g.proveedorTexto||"—"}</td><td class="muted">${g.fecha}</td><td class="num">${eur(g.baseImponible)}</td><td class="num"><strong>${eur(g.total)}</strong></td></tr>`).join("");
      const cuerpo=gs.length?`<table><thead><tr><th>Concepto</th><th>Proveedor</th><th>Fecha</th><th class="num">Base</th><th class="num">Total</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("gastos","Sin gastos todavía","Registra tus gastos y asígnalos a un proveedor.",`<button class="btn small" onclick="modalGasto()">+ Nuevo gasto</button>`);
      view(panel("Gastos",cuerpo,`<button class="btn small" onclick="modalGasto()">+ Nuevo gasto</button>`));
    }
    async function vCobros() {
      view('<div class="muted">Cargando…</div>');
      const fs=await api("/facturas");
      const saldos=await Promise.all(fs.map(f=>api("/facturas/"+f.id+"/saldo").catch(()=>null)));
      const filas=fs.map((f,i)=>{const s=saldos[i]||{}; const est=s.estado||"Pendiente"; const p=est==="Liquidado"?"ok":(est==="Parcial"?"part":"wait");
        return `<tr><td><strong>${f.numeroCompleto}</strong></td><td>${f.clienteNombre}</td><td class="num">${eur(f.total)}</td><td class="num">${eur(s.liquidado||0)}</td><td class="num">${eur(s.pendiente??f.total)}</td><td class="right"><span class="pill ${p}">${est}</span></td></tr>`;}).join("");
      const cuerpo=fs.length?`<table><thead><tr><th>Factura</th><th>Cliente</th><th class="num">Total</th><th class="num">Cobrado</th><th class="num">Pendiente</th><th class="right">Estado</th></tr></thead><tbody>${filas}</tbody></table>`:vacio("cobros","Nada que cobrar aún","Cuando emitas facturas verás aquí su estado de cobro.");
      view(panel("Cobros de facturas",cuerpo));
    }
    async function vInformes() {
      view('<div class="muted">Cargando…</div>');
      const anio=new Date().getFullYear();
      const libro=await api(`/informes/libro-iva?tipo=Repercutido&desde=${anio}-01-01&hasta=${anio}-12-31`);
      const filas=libro.asientos.map(a=>`<tr><td class="muted">${a.fecha}</td><td><strong>${a.documento}</strong></td><td>${a.tercero}</td><td class="num">${eur(a.base)}</td><td class="num">${eur(a.cuota)}</td></tr>`).join("");
      const total=`<tr><td colspan="3" class="right"><strong>Totales</strong></td><td class="num"><strong>${eur(libro.totalBase)}</strong></td><td class="num"><strong>${eur(libro.totalCuota)}</strong></td></tr>`;
      const cuerpo=libro.asientos.length?`<table><thead><tr><th>Fecha</th><th>Documento</th><th>Cliente</th><th class="num">Base</th><th class="num">Cuota IVA</th></tr></thead><tbody>${filas}${total}</tbody></table>`:vacio("informes","Sin movimientos en el periodo","Emite facturas para ver aquí tu libro de IVA repercutido.");
      view(panel(`Libro de IVA repercutido · ${anio}`,cuerpo,`<button class="btn small ghost" onclick="descargarCsv()">↓ Exportar CSV (gestoría)</button>`));
    }
    async function descargarCsv(){ const anio=new Date().getFullYear();
      const r=await fetch(`/informes/libro-iva/csv?tipo=Repercutido&desde=${anio}-01-01&hasta=${anio}-12-31`,{headers:{Authorization:"Bearer "+token}});
      const b=await r.blob(); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="libro-iva.csv"; a.click(); URL.revokeObjectURL(u); }

    /* modales */
    let modalSave=null;
    function abrir(t,b,f){ document.getElementById("modalTitle").textContent=t; document.getElementById("modalBody").innerHTML=b; modalSave=f; document.getElementById("modalBg").style.display="grid"; }
    function cerrarModal(){ document.getElementById("modalBg").style.display="none"; modalSave=null; }
    async function guardarModal(){ if(modalSave){ try{ await modalSave(); cerrarModal(); }catch(e){ alert(e.message); } } }
    const val=id=>document.getElementById(id).value;
    const ivaSel=id=>`<select id="${id}"><option value="IVA21">IVA 21%</option><option value="IVA10">IVA 10%</option><option value="IVA4">IVA 4%</option><option value="IVA0">Exento</option></select>`;

    function modalCliente(){ abrir("Nuevo cliente",`<label>Nombre</label><input id="c_nombre" placeholder="Nombre o razón social"/><div class="grid2"><div><label>NIF (opcional)</label><input id="c_nif"/></div><div><label>Email (opcional)</label><input id="c_email"/></div></div>`,
      async()=>{ await api("/clientes",{method:"POST",body:JSON.stringify({nombre:val("c_nombre"),nifFiscal:val("c_nif")||null,email:val("c_email")||null})}); vClientes(); }); }
    function modalProveedor(){ abrir("Nuevo proveedor",`<label>Nombre</label><input id="pr_nombre" placeholder="Nombre o razón social"/><div class="grid2"><div><label>NIF (opcional)</label><input id="pr_nif"/></div><div><label>IRPF (opcional)</label><input id="pr_irpf" type="number" value="0"/></div></div>`,
      async()=>{ await api("/proveedores",{method:"POST",body:JSON.stringify({nombre:val("pr_nombre"),nifFiscal:val("pr_nif")||null,porcentajeIrpfDefecto:Number(val("pr_irpf"))})}); vProveedores(); }); }
    function modalProducto(){ abrir("Nuevo artículo",`<label>Nombre</label><input id="p_nombre" placeholder="Nombre del producto o servicio"/>
      <div class="grid2"><div><label>Código / EAN (opcional)</label><input id="p_ref" placeholder="Ej. 8412345678901"/></div><div><label>Precio (€)</label><input id="p_precio" type="number" value="0"/></div></div>
      <label>IVA</label>${ivaSel("p_iva")}`,
      async()=>{ await api("/productos",{method:"POST",body:JSON.stringify({nombre:val("p_nombre"),referencia:val("p_ref")||null,precioUnitario:Number(val("p_precio")),codigoIva:val("p_iva"),tipo:"Servicio"})}); vProductos(); }); }
    async function modalGasto(){ const provs=await api("/proveedores");
      const opts=`<option value="">— Sin proveedor —</option>`+provs.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join("");
      abrir("Nuevo gasto",`<label>Concepto</label><input id="g_conc" placeholder="Ej. Alquiler, suministros…"/>
        <div class="grid2"><div><label>Proveedor</label><select id="g_prov">${opts}</select></div><div><label>Base (€)</label><input id="g_base" type="number" value="0"/></div></div>
        <label>IVA</label>${ivaSel("g_iva")}`,
        async()=>{ await api("/gastos",{method:"POST",body:JSON.stringify({concepto:val("g_conc"),proveedorId:val("g_prov")||null,baseImponible:Number(val("g_base")),codigoIva:val("g_iva")})}); vGastos(); }); }
    async function modalFactura(){ const cs=await api("/clientes");
      const opts=cs.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("");
      abrir("Nueva factura",`<label>Cliente</label><select id="f_cli">${opts}</select>
        <label style="margin-top:16px">Concepto</label>
        <div class="row"><div><input id="f_desc" placeholder="Descripción"/></div><div><label>Cant.</label><input id="f_cant" type="number" value="1"/></div><div><label>Precio €</label><input id="f_prec" type="number" value="0"/></div><div><label>IVA</label>${ivaSel("f_iva")}</div></div>`,
        async()=>{ await api("/facturas",{method:"POST",body:JSON.stringify({clienteId:val("f_cli"),lineas:[{descripcion:val("f_desc"),cantidad:Number(val("f_cant")),precioUnitario:Number(val("f_prec")),codigoIva:val("f_iva")}]})}); vFacturas(); }); }

    document.getElementById("email").value = new URLSearchParams(location.search).get("email") || "";
  </script>
</body>
</html>
