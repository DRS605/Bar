<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocina · Bar Query</title>
<style>
  :root{ --bg:#0f1512; --surface:#18221c; --fg:#eaf3ee; --muted:#9db0a6; --line:#273530;
    --cocina:#2f8a66; --barra:#b46a2e; --pos:#4fb488; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  header{ position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap; }
  header h1{ font-size:18px; margin:0; font-weight:700; letter-spacing:.02em; }
  header .sp{ flex:1; }
  .tab{ background:transparent; border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:8px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .tab.on{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .dot{ font-size:12px; color:var(--muted); }
  main{ padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--cocina); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .card.barra{ border-left-color:var(--barra); }
  .card .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card .mesa{ font-weight:800; font-size:15px; }
  .card .min{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .card .desc{ font-size:20px; font-weight:700; line-height:1.15; }
  .card .cant{ color:var(--pos); }
  .card .nota{ font-size:13px; color:var(--barra); font-weight:600; }
  .card .zona{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:800; }
  .serv{ margin-top:6px; background:var(--pos); color:#06281c; border:0; border-radius:10px; padding:11px; font-weight:800; font-size:15px; cursor:pointer; }
  .vacio{ grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>👨‍🍳 Cocina</h1>
  <button class="tab on" data-z="" onclick="setZona('')">Todo</button>
  <button class="tab" data-z="Cocina" onclick="setZona('Cocina')">Cocina</button>
  <button class="tab" data-z="Barra" onclick="setZona('Barra')">Barra</button>
  <span class="sp"></span>
  <span class="dot" id="estado">—</span>
</header>
<main id="tablero"><div class="vacio">Cargando…</div></main>
<script>
  let token = null;
  try{ const s = JSON.parse(localStorage.getItem("bq_sesion")||"null"); token = s && s.token; }catch{}
  let zona = "";
  const main = document.getElementById("tablero");
  const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function setZona(z){ zona=z; for(const b of document.querySelectorAll(".tab")) b.classList.toggle("on", b.dataset.z===z); cargar(); }

  function minutos(desde){
    const ms = Date.now() - new Date(desde).getTime();
    const m = Math.max(0, Math.floor(ms/60000));
    return m<1 ? "ahora" : (m+" min");
  }

  async function api(path, opts={}){
    const h = Object.assign({ "Content-Type":"application/json" }, opts.headers||{});
    if(token) h["Authorization"] = "Bearer "+token;
    const r = await fetch(path, Object.assign({}, opts, { headers:h }));
    if(!r.ok) throw new Error("HTTP "+r.status);
    const ct = r.headers.get("content-type")||""; return ct.includes("json") ? r.json() : null;
  }

  async function cargar(){
    if(!token){ main.innerHTML = '<div class="vacio">Inicia sesión en Bar Query (en este dispositivo) para ver la cocina.</div>'; return; }
    try{
      const items = await api("/cocina/pendientes"+(zona?("?zona="+zona):""));
      document.getElementById("estado").textContent = new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})+" · "+items.length+" por servir";
      if(!items.length){ main.innerHTML = '<div class="vacio">Todo servido 🎉</div>'; return; }
      main.innerHTML = items.map(it=>`<div class="card ${it.zona==='Barra'?'barra':''}">
        <div class="top"><span class="mesa">${esc(it.mesa)}</span><span class="min">${minutos(it.desde)}</span></div>
        <div class="zona">${esc(it.zona)}</div>
        <div class="desc"><span class="cant">${it.cantidad}×</span> ${esc(it.descripcion)}</div>
        ${it.nota?`<div class="nota">⚠ ${esc(it.nota)}</div>`:""}
        <button class="serv" onclick="servir('${it.comandaId}','${it.lineaId}',this)">Servido ✓</button>
      </div>`).join("");
    }catch(e){
      document.getElementById("estado").textContent = "sin conexión";
    }
  }

  async function servir(comandaId, lineaId, btn){
    if(btn){ btn.disabled=true; btn.textContent="…"; }
    try{ await api("/cocina/servir",{method:"POST",body:JSON.stringify({comandaId,lineaId})}); cargar(); }
    catch(e){ if(btn){ btn.disabled=false; btn.textContent="Servido ✓"; } }
  }

  cargar();
  setInterval(cargar, 8000);
</script>
</body>
</html>
