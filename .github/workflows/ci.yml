name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alxor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Los tests de integración se conectan a este PostgreSQL (la base alxor_test se crea sola).
      ALXOR_TEST_CONEXION: "Host=localhost;Port=5432;Database=alxor_test;Username=postgres;Password=postgres"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # QuestPDF (SkiaSharp) necesita fontconfig para generar los PDF de las facturas.
      - name: Dependencias nativas para PDF
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restaurar
        run: dotnet restore

      - name: Compilar (estricto, warnings como errores)
        run: dotnet build --no-restore --configuration Release

      - name: Tests (unitarios + integración)
        run: dotnet test --no-build --configuration Release --verbosity normal
